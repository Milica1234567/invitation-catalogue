<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation catalogue</title>
    <script>
      // GitHub Pages has no SPA fallback. Preserve the requested route in the
      // query string, load the project root, and let index.html restore it.
      (function (location) {
        var projectPathSegments = 1;
        var projectRoot = location.pathname
          .split("/")
          .slice(0, projectPathSegments + 1)
          .join("/");
        var route = location.pathname
          .slice(1)
          .split("/")
          .slice(projectPathSegments)
          .join("/")
          .replace(/&/g, "~and~");
        var query = location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "";

        location.replace(
          location.protocol +
            "//" +
            location.host +
            projectRoot +
            "/?/" +
            route +
            query +
            location.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
